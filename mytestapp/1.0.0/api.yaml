app_version: 1.0.0
name: mytestapp
description: MyTestApp
contact_info:
  name: "Roman"
  url: https://example.com
  email: example@example.com
tags:
  - PostgreSQL
categories:
  - Other
authentication:
  required: true
  parameters:
    - name: username
      description: Username
      required: true
      example: 'username'
      schema:
        type: string
    - name: password
      description: Password
      required: true
      example: '******'
      schema:
        type: string
    - name: host
      description: Host address can be IP or domain
      required: true
      example: 'Database host address'
      schema:
        type: string
    - name: port
      description: Port number
      required: true
      example: '5000'
      schema:
        type: string
    - name: database
      description: Database name
      required: true
      example: 'database'
      schema:
        type: string
actions:
  - name: query_database
    description: Query database 
    parameters:
      - name: query
        description: Query a database
        required: true
        multiline: true
        example: 'SELECT * FROM example'
        schema:
          type: string        
    returns:
      schema:
        type: string
large_image: data:image/jpeg;base64,